# HTTPS configuration used by docker-compose.tls.yml. Mount the certificate
# chain and key as certs/fullchain.pem and certs/privkey.pem.
events {}

http {
	include /etc/nginx/databix/common.conf;

	server {
		listen 80;
		server_name _;

		return 301 https://$host$request_uri;
	}

	server {
		listen 443 ssl;
		http2 on;
		server_name _;

		ssl_certificate /etc/nginx/certs/fullchain.pem;
		ssl_certificate_key /etc/nginx/certs/privkey.pem;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_prefer_server_ciphers off;
		ssl_session_cache shared:SSL:10m;
		ssl_session_timeout 1d;
		ssl_session_tickets off;

		add_header Strict-Transport-Security "max-age=63072000" always;

		include /etc/nginx/databix/locations.conf;
	}
}
